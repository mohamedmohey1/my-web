<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Expense Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-mount"></div>

    <main class="main-content" id="dashboard-page">
      <div class="topbar">
        <button class="menu-toggle" id="menu-toggle">☰</button>
        <div>
          <h1>Dashboard</h1>
          <p class="subtitle">A quick overview of your spending</p>
        </div>
        <a class="btn btn-primary" href="add.html">➕ Add Expense</a>
      </div>

      <section class="stat-grid">
        <div class="card stat-card">
          <div class="stat-icon">💰</div>
          <div class="stat-label">Total Expenses</div>
          <div class="stat-value" id="stat-total">$0.00</div>
        </div>
        <div class="card stat-card">
          <div class="stat-icon">📅</div>
          <div class="stat-label">Today</div>
          <div class="stat-value" id="stat-today">$0.00</div>
        </div>
        <div class="card stat-card">
          <div class="stat-icon">🗓️</div>
          <div class="stat-label">This Month</div>
          <div class="stat-value" id="stat-month">$0.00</div>
        </div>
        <div class="card stat-card">
          <div class="stat-icon">🔢</div>
          <div class="stat-label">Number of Expenses</div>
          <div class="stat-value" id="stat-count">0</div>
        </div>
      </section>

      <section class="dashboard-columns">
        <div class="section-card">
          <h2>Latest Expenses</h2>
          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Category</th>
                  <th>Amount</th>
                  <th>Note</th>
                </tr>
              </thead>
              <tbody id="latest-expenses-body"></tbody>
            </table>
          </div>
          <div class="empty-state" id="latest-expenses-empty" style="display:none;">
            <div class="empty-icon">🧾</div>
            <p>No expenses yet. Click "Add Expense" to get started.</p>
          </div>
        </div>

        <div class="section-card">
          <h2>Spending by Category</h2>
          <ul class="category-list" id="dashboard-category-list"></ul>
        </div>
      </section>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
