<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Expense - Expense Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-mount"></div>

    <main class="main-content">
      <div class="topbar">
        <button class="menu-toggle" id="menu-toggle">☰</button>
        <div>
          <h1>Add Expense</h1>
          <p class="subtitle">Log a new expense</p>
        </div>
      </div>

      <section class="card form-card">
        <div class="alert" id="add-alert"></div>

        <form id="add-expense-form" novalidate>
          <div class="field" id="add-amount-field">
            <label for="add-amount">Amount ($)</label>
            <input type="number" id="add-amount" step="0.01" min="0" placeholder="0.00" />
            <div class="error-message"></div>
          </div>

          <div class="field" id="add-category-field">
            <label for="add-category">Category</label>
            <select id="add-category"></select>
            <div class="error-message"></div>
          </div>

          <div class="field" id="add-date-field">
            <label for="add-date">Date</label>
            <input type="date" id="add-date" />
            <div class="error-message"></div>
          </div>

          <div class="field">
            <label for="add-note">Note (optional)</label>
            <textarea id="add-note" placeholder="e.g. Groceries at the supermarket"></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Add Expense</button>
            <a href="index.html" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
