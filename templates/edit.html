<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Expense - Expense Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-mount"></div>

    <main class="main-content">
      <div class="topbar">
        <button class="menu-toggle" id="menu-toggle">☰</button>
        <div>
          <h1>Edit Expense</h1>
          <p class="subtitle">Update the details of this expense</p>
        </div>
      </div>

      <section class="card form-card" id="edit-page-content">
        <div class="alert" id="edit-alert"></div>

        <form id="edit-expense-form" novalidate>
          <input type="hidden" id="edit-id" />

          <div class="field" id="edit-amount-field">
            <label for="edit-amount">Amount ($)</label>
            <input type="number" id="edit-amount" step="0.01" min="0" placeholder="0.00" />
            <div class="error-message"></div>
          </div>

          <div class="field" id="edit-category-field">
            <label for="edit-category">Category</label>
            <select id="edit-category"></select>
            <div class="error-message"></div>
          </div>

          <div class="field" id="edit-date-field">
            <label for="edit-date">Date</label>
            <input type="date" id="edit-date" />
            <div class="error-message"></div>
          </div>

          <div class="field">
            <label for="edit-note">Note (optional)</label>
            <textarea id="edit-note" placeholder="e.g. Groceries at the supermarket"></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="expenses.html" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
